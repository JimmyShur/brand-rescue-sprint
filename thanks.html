<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#11110f">
  <title>Request received — Shurpath</title>
  <style>
    :root { --ink:#11110f; --paper:#f3efe7; --signal:#d5ff45; --warm:#d96542; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--ink); color:var(--paper); font:18px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; }
    main { width:min(760px,calc(100% - 40px)); padding:64px 0; }
    .eyebrow { color:var(--signal); font:700 .76rem/1.2 ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:18px 0; font-size:clamp(3rem,9vw,7rem); line-height:.9; letter-spacing:-.065em; }
    h1 em { color:var(--warm); font-style:normal; }
    p { max-width:620px; color:#c9c5bd; }
    a { display:inline-flex; min-height:48px; align-items:center; margin-top:24px; padding:0 22px; background:var(--signal); color:var(--ink); text-decoration:none; font:800 .85rem/1 ui-monospace,monospace; text-transform:uppercase; box-shadow:5px 5px 0 var(--warm); }
  </style>
</head>
<body><main><div class="eyebrow">Request received</div><h1>Good signal.<br><em>We’ll take a look.</em></h1><p>Shurpath will review your request and reply if the Brand Rescue Sprint matches the problem you’re trying to solve.</p><a href="/">Back to the Sprint →</a></main></body>
</html>
