<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08080B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Roboto+Condensed:wght@800;900&display=swap" rel="stylesheet">
  <title>Request received — SHUR PATH</title>
  <style>
    :root { --void:#08080B; --graphite:#17171D; --white:#FFFFFF; --violet:#7A35FF; --blue:#69A7FF; --muted:rgba(255,255,255,.64); --line:rgba(255,255,255,.16); --display:"Roboto Condensed","Arial Narrow",Impact,sans-serif; --body:Inter,ui-sans-serif,system-ui,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 80% 18%, rgba(122,53,255,.25), transparent 28rem), radial-gradient(circle at 18% 76%, rgba(105,167,255,.14), transparent 24rem), var(--void); color:var(--white); font:18px/1.5 var(--body); }
    main { width:min(780px,calc(100% - 40px)); padding:64px 0; position:relative; }
    main::before { content:""; display:block; width:min(420px,70vw); height:90px; margin:0 0 38px; background:radial-gradient(circle at 5% 72%, var(--blue) 0 4px, transparent 5px), radial-gradient(circle at 92% 18%, var(--white) 0 3px, transparent 4px), linear-gradient(150deg, transparent 0 12%, var(--violet) 13% 16%, transparent 17% 55%, rgba(105,167,255,.8) 56% 58%, transparent 59%); opacity:.9; }
    .eyebrow { color:var(--blue); font:800 .74rem/1.2 var(--body); letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:18px 0; font-family:var(--display); font-size:clamp(3.5rem,12vw,8rem); line-height:.82; letter-spacing:-.05em; text-transform:uppercase; }
    h1 em { color:var(--violet); font-style:normal; text-shadow:0 0 32px rgba(122,53,255,.38); }
    p { max-width:620px; color:var(--muted); }
    a { display:inline-flex; min-height:48px; align-items:center; margin-top:24px; padding:0 24px; border:1px solid var(--line); border-radius:999px; background:var(--violet); color:var(--white); text-decoration:none; font:800 .82rem/1 var(--body); letter-spacing:.08em; text-transform:uppercase; box-shadow:0 18px 45px rgba(122,53,255,.28); }
    a:focus-visible { outline:3px solid var(--blue); outline-offset:4px; }
  </style>
</head>
<body><main><div class="eyebrow">Request received</div><h1>Good signal.<br><em>We’ll take a look.</em></h1><p>SHUR PATH will review your request and reply if the Brand Rescue Sprint matches the problem you’re trying to solve.</p><a href="/">Back to the Sprint →</a></main></body>
</html>
